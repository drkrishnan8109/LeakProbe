<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">LeakProbe: what each tool call does</title>
  <desc id="desc">Hand-drawn-style flow diagram of the synthetic Net3 investigation tools, showing each call, its purpose, and the final Nemotron summary.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#26394b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="8"/>
      <feColorMatrix values="0 0 0 0 0.91 0 0 0 0 0.89 0 0 0 0 0.82 0 0 0 .08 0"/>
    </filter>
    <style>
      .ink { fill:#24384a; font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',cursive; }
      .title { font-size:44px; font-weight:700; }
      .sub { font-size:22px; }
      .num { font-size:27px; font-weight:700; fill:#fffdf5; }
      .tool { font-size:24px; font-weight:700; }
      .body { font-size:21px; }
      .small { font-size:18px; }
      .card { fill:#fffdf5; stroke:#26394b; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .line { fill:none; stroke:#26394b; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .blue { fill:#dceaf3; stroke:#426a83; }
      .orange { fill:#fff0d6; stroke:#b77932; }
      .green { fill:#e2f0df; stroke:#56805a; }
    </style>
  </defs>
  <rect width="1600" height="1260" fill="#fbf7ea"/>
  <rect width="1600" height="1260" filter="url(#paper)" opacity=".45"/>

  <text x="800" y="72" text-anchor="middle" class="ink title">LeakProbe: what each tool call does</text>
  <text x="800" y="112" text-anchor="middle" class="ink sub">Nemotron chooses tools · Python runs the allowed functions · all readings are synthetic</text>

  <!-- Row 1 -->
  <path class="card blue" d="M55 170 Q58 164 68 166 L740 165 Q750 168 748 179 L750 397 Q747 405 737 403 L64 405 Q53 402 55 391 Z"/>
  <circle cx="95" cy="207" r="25" fill="#426a83"/><text x="95" y="216" text-anchor="middle" class="ink num">1</text>
  <text x="138" y="215" class="ink tool">get_observations()</text>
  <path d="M104 277 C145 248 184 310 225 275 S307 244 350 282 S430 308 474 268" fill="none" stroke="#4c8b9b" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 319 H474 M104 255 V321" fill="none" stroke="#8b9ca3" stroke-width="2"/>
  <text x="510" y="278" class="ink body"><tspan x="510" dy="0">Read noisy sensor time series</tspan><tspan x="510" dy="31">for this six-hour case.</tspan></text>
  <text x="510" y="364" class="ink small" fill="#55717a">WHY: establish what the sensors observed</text>

  <path class="line" d="M770 285 C792 285 804 285 824 285"/>

  <path class="card" d="M850 170 Q857 165 867 167 L1537 165 Q1547 168 1545 179 L1547 394 Q1544 404 1533 402 L859 405 Q848 402 850 391 Z"/>
  <circle cx="890" cy="207" r="25" fill="#426a83"/><text x="890" y="216" text-anchor="middle" class="ink num">2</text>
  <text x="933" y="215" class="ink tool">get_network()</text>
  <path d="M909 283 L966 252 L1020 288 L1078 251 L1133 285 M966 252 L967 333 M1020 288 L1020 348 M1078 251 L1078 334" fill="none" stroke="#426a83" stroke-width="4" stroke-linecap="round"/>
  <circle cx="909" cy="283" r="9" fill="#e2a34c"/><circle cx="966" cy="252" r="9" fill="#77a5bd"/><circle cx="1020" cy="288" r="9" fill="#77a5bd"/><circle cx="1078" cy="251" r="9" fill="#77a5bd"/><circle cx="1133" cy="285" r="9" fill="#e2a34c"/>
  <text x="1170" y="271" class="ink body"><tspan x="1170" dy="0">See network size, installed</tspan><tspan x="1170" dy="31">sensors, candidate pipes,</tspan><tspan x="1170" dy="31">and remaining time budget.</tspan></text>
  <text x="1170" y="370" class="ink small" fill="#55717a">WHY: understand what can be checked</text>

  <!-- serpentine connector -->
  <path class="line" d="M1200 420 C1200 447 1180 455 1150 455"/>

  <!-- Row 2, right to left -->
  <path class="card orange" d="M850 470 Q857 465 867 467 L1537 465 Q1547 468 1545 479 L1547 704 Q1544 714 1533 712 L859 715 Q848 712 850 701 Z"/>
  <circle cx="890" cy="507" r="25" fill="#b77932"/><text x="890" y="516" text-anchor="middle" class="ink num">3</text>
  <text x="933" y="515" class="ink tool">get_operation_records()</text>
  <path d="M922 555 Q922 548 930 548 H1064 Q1071 548 1071 556 V667 Q1070 675 1063 675 H930 Q922 674 922 666 Z" fill="#fffaf0" stroke="#b77932" stroke-width="3"/>
  <path d="M944 578 H1048 M944 603 H1036 M944 628 H1048 M944 653 H1014" stroke="#9b805a" stroke-width="3" stroke-linecap="round"/>
  <text x="1100" y="575" class="ink body"><tspan x="1100" dy="0">Check incident or maintenance</tspan><tspan x="1100" dy="31">notes. Net3 currently has</tspan><tspan x="1100" dy="31">no operation records.</tspan></text>
  <text x="1100" y="679" class="ink small" fill="#9b6225">WHY: avoid treating a reported event as fact</text>

  <path class="line" d="M830 590 C808 590 795 590 775 590"/>
  <path class="card" d="M55 470 Q58 464 68 466 L740 465 Q750 468 748 479 L750 704 Q747 714 737 712 L64 715 Q53 712 55 701 Z"/>
  <circle cx="95" cy="507" r="25" fill="#426a83"/><text x="95" y="516" text-anchor="middle" class="ink num">4</text>
  <text x="138" y="515" class="ink tool">compare_hypotheses()</text>
  <path d="M110 568 H342 M110 606 H300 M110 644 H255" stroke="#6e9caf" stroke-width="12" stroke-linecap="round"/>
  <circle cx="350" cy="555" r="24" fill="none" stroke="#26394b" stroke-width="4"/><path d="M368 574 L394 600" stroke="#26394b" stroke-width="6" stroke-linecap="round"/>
  <text x="425" y="570" class="ink body"><tspan x="425" dy="0">Rank normal operation and</tspan><tspan x="425" dy="31">candidate leak pipes by fit</tspan><tspan x="425" dy="31">to the available readings.</tspan></text>
  <text x="425" y="678" class="ink small" fill="#ad5a35">WHY: find scenarios worth investigating</text>
  <path d="M362 664 Q404 642 459 663" fill="none" stroke="#bd6d43" stroke-width="3"/>
  <text x="362" y="699" class="ink small" fill="#ad5a35">fit score ≠ probability</text>

  <path class="line" d="M390 733 C390 759 410 768 440 768"/>

  <!-- Row 3 -->
  <path class="card green" d="M55 790 Q58 784 68 786 L740 785 Q750 788 748 799 L750 1008 Q747 1018 737 1016 L64 1019 Q53 1016 55 1005 Z"/>
  <circle cx="95" cy="827" r="25" fill="#56805a"/><text x="95" y="836" text-anchor="middle" class="ink num">5</text>
  <text x="138" y="835" class="ink tool">recommend_measurement()</text>
  <path d="M126 884 C126 858 161 858 161 884 C161 903 143 919 143 919 C143 919 126 903 126 884 Z" fill="#f1b64f" stroke="#775a28" stroke-width="3"/>
  <circle cx="144" cy="883" r="6" fill="#fffdf5"/>
  <text x="205" y="884" class="ink body"><tspan x="205" dy="0">Pick a feasible unmeasured</tspan><tspan x="205" dy="31">pressure-gauge location.</tspan><tspan x="205" dy="31">Uses spread among leading fits.</tspan></text>
  <text x="205" y="988" class="ink small" fill="#557652">WHY: seek a reading that separates candidates</text>

  <path class="line" d="M770 902 C792 902 804 902 824 902"/>
  <path class="card orange" d="M850 790 Q857 785 867 787 L1537 785 Q1547 788 1545 799 L1547 1008 Q1544 1018 1533 1016 L859 1019 Q848 1016 850 1005 Z"/>
  <circle cx="890" cy="827" r="25" fill="#b77932"/><text x="890" y="836" text-anchor="middle" class="ink num">6</text>
  <text x="933" y="835" class="ink tool">collect_demo_measurement(point)</text>
  <path d="M936 905 Q936 881 960 881 H1022 Q1046 881 1046 905 V938 Q1046 962 1022 962 H960 Q936 962 936 938 Z" fill="#fff8e9" stroke="#b77932" stroke-width="3"/>
  <path d="M991 921 L1017 900 M991 921 L970 930" stroke="#426a83" stroke-width="4" stroke-linecap="round"/><circle cx="991" cy="921" r="6" fill="#b77932"/>
  <text x="1080" y="884" class="ink body"><tspan x="1080" dy="0">Reveal the stored synthetic</tspan><tspan x="1080" dy="31">pressure reading; spends</tspan><tspan x="1080" dy="31">10 minutes from the budget.</tspan></text>
  <text x="1080" y="988" class="ink small" fill="#9b6225">WHY: add evidence from a new point</text>

  <path class="line" d="M1200 1036 C1200 1060 1170 1071 1135 1071"/>

  <!-- final loop / answer -->
  <path class="card blue" d="M850 1085 Q857 1080 867 1082 L1537 1080 Q1547 1083 1545 1094 L1547 1194 Q1544 1204 1533 1202 L859 1205 Q848 1202 850 1191 Z"/>
  <circle cx="890" cy="1122" r="25" fill="#426a83"/><text x="890" y="1131" text-anchor="middle" class="ink num">7</text>
  <text x="933" y="1128" class="ink tool">compare_hypotheses() again</text>
  <text x="933" y="1167" class="ink body">Re-rank with the new reading; flag close fits as ambiguous.</text>
  <text x="933" y="1194" class="ink small" fill="#55717a">Then Nemotron summarizes evidence, uncertainty, and next step.</text>

  <path class="line" d="M830 1140 C800 1140 790 1132 772 1120"/>
  <path d="M765 1115 C710 1080 710 1040 765 1025" fill="none" stroke="#26394b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="72" y="1092" class="ink small" fill="#426a83">still uncertain?</text>
  <text x="72" y="1121" class="ink small" fill="#426a83">explain uncertainty or</text>
  <text x="72" y="1150" class="ink small" fill="#426a83">request another feasible</text>
  <text x="72" y="1179" class="ink small" fill="#426a83">reading, if budget allows</text>

  <path d="M420 1227 Q800 1233 1180 1227" fill="none" stroke="#b77932" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="1250" text-anchor="middle" class="ink small" fill="#805f32">Python validates tool arguments and enforces the measurement budget · no real utility sensors or controls are connected</text>
</svg>
